<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0f1c" />
    <title>Dash Invest</title>
    <script>
      // Aplica o tema antes da primeira pintura para evitar flash claro.
      (function () {
        var theme = "dark";
        try {
          if (localStorage.getItem("dash-invest-theme") === "light") theme = "light";
        } catch (error) {
          // Armazenamento indisponível: mantém o tema escuro padrão.
        }
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#f3f5f9" : "#0a0f1c");
      })();
    </script>
    <style>
      html {
        background: #0a0f1c;
      }
      html[data-theme="light"] {
        background: #f3f5f9;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
